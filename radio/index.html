<style>
  :root{
    --bg:#000000;
    --card:rgba(5,5,5,.92);
    --card-border:rgba(226,188,92,.38);
    --card-border-soft:#2a2516;
    --text:#FFFFFF;
    --muted:#B8B09A;
    --accent:#E2BC5C;
    --accent-strong:#E2BC5C;
    --accent-bg:#E2BC5C;
    --link:#B57EDC;
    --hover:#40E0D0;
    --track:#2E2B26;
    --shadow:0 0 0 1px rgba(0,0,0,.9), 0 18px 50px rgba(0,0,0,.75), 0 0 46px rgba(226,188,92,.06);
    --amber-deep:#C2923A;
  }
  *{box-sizing:border-box}
  /* One screen at normal sizes: the stage fills the viewport and
     nothing scrolls. The player also has a minimum size, though
     (see .wrap / .card below): when the window shrinks past that
     floor, the page is allowed to scroll — in the browser and in
     the installed home-screen app alike — instead of the face
     being crushed into whatever space is left. */
  html{height:100%}
  html,body{margin:0;padding:0}
  body{
    font-family:"Courier Prime","Courier New",Courier,monospace;
    background:#000;
    color:var(--text);
    display:block;
    padding:0;
    min-height:100vh;
    min-height:100dvh;
  }
  button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:36px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--hover);outline-offset:3px}
  a{color:var(--link)}
  a:hover{color:var(--hover)}

  /* The stage fills exactly one screen: full dynamic viewport
     height, with padding all round so the face never runs edge to
     edge on a tall phone (iPhone Air and the like). The padding
     grows by the device's safe-area insets, so nothing sits under
     the camera area or the home indicator in the installed app. */
  /* 16:9 stage: the window is a black padded frame and the player
     sits centred inside it at a standard landscape 16:9 shape.
     It never stretches to fill the window — its width is capped
     by both the available width AND the available height
     (height × 16/9), so at any window size, full-size included,
     the shape stays exactly 16:9 with padding around it. */
  .wrap{
    width:100%;max-width:none;margin:0;
    min-height:100vh;min-height:100dvh;
    /* Minimum stage width: the 640px player floor below plus the
       frame's side padding. Below this the page scrolls sideways
       rather than squeezing the player narrower. The compact
       phone and short-landscape layouts further down set their
       own smaller floors. */
    min-width:680px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:#000;
    padding:
      calc(20px + env(safe-area-inset-top, 0px))

    .volume-slider::-moz-range-thumb{width:19px;height:19px}
    .play-btn{width:62px;height:62px}
    .play-btn svg{width:27px;height:27px}
    .schedule-bar{font-size:12.5px;padding-top:10px;gap:14px}
    .schedule-bar .live-clock{padding-left:14px}
    .hint{font-size:13px}
  }

  /* Chapter line — display only, part of the track's info, never a
     control: when the current episode carries chapters (from the
     feed), the current chapter's title sits under the status line.
     Episodes and tracks without chapters never show it. */
  .broadcast-line{font-size:11.5px;color:var(--muted);margin:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .broadcast-line .bcast-kicker{font-family:"Orbitron",sans-serif;font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#D92B20;margin-right:7px}
  .broadcast-line .bcast-kicker.live{color:#1E9E5A}
  .chapter-line{font-size:11.5px;color:var(--muted);margin:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chapter-kicker{font-family:"Orbitron",sans-serif;font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-right:7px}
  /* With a chapter line on the face, the wave window gives up a
     little of its floor so the whole face still fits one screen. */
  .card.has-chapters .wave-window,.card.has-chapters .wave-box{min-height:88px}
  @media (max-width:680px){
    .card.has-chapters .wave-window,.card.has-chapters .wave-box{min-height:74px}
    .chapter-line{font-size:11px}
  }
  @media (orientation:landscape) and (max-height:620px){
    .card.has-chapters .wave-window,.card.has-chapters .wave-box{min-height:92px}
  }
</style>

  /* ==== THE ROTATION ================================================

     the page stays open — the player fetches the feed and rebuilds
     the rotation from its episodes, newest first, each with its
     own title, artwork, and duration from the feed. The feed sends
     a cross-origin allow header, so the browser reads it directly.
     The broadcast runs on a two-hour cycle (see THE CYCLE below):
     each cycle airs one episode, and pressing play joins that
     episode wherever the cycle has reached. There is NO fallback
     rotation: the GitHub tracks in assets/ are not part of the
     rotation and are never played. If the feed cannot be read, or
     it has no playable episodes, the fallback is STATIC — the
     Off Air face with the static signal — until a later feed
     read succeeds. The rotation therefore
     starts empty, with the face showing Off Air, and fills in
     only when the feed lands. New feed episodes need no edit at
     all — uploading to the feed is enough.
     ================================================================== */
